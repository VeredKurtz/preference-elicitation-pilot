services:
  - type: web
    name: preference-elicitation-pilot
    runtime: python
    plan: 0.5c-512mb
    buildCommand: ""
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SUCCESS_CODE
        sync: false
      - key: SCREENOUT_CODE
        sync: false
    disk:
      name: preference-data
      mountPath: /var/data
      sizeGB: 1
